name: Build module zip

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Show toolchain
        run: |
          docker version
          git --version
          zip --version | head -1

      - name: Vendor oh-my-zsh + plugins
        run: bash build/fetch-omz.sh

      - name: Build sshd (musl)
        run: bash build/build-sshd.sh

      - name: Assemble module tree
        run: bash build/assemble.sh

      - name: Package zip
        id: pack
        run: |
          version="$(sed -n 's/^version=//p' module/module.prop)"
          [ -n "$version" ] || version="dev-${GITHUB_SHA::7}"
          name="ksutools-${version}.zip"
          ( cd module && zip -qr9 "../${name}" . )
          echo "archive=${name}" >> "$GITHUB_OUTPUT"
          ls -l "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ksutools-zip
          path: ksutools-*.zip
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ksutools-*.zip
