name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Three independent build groups run in parallel on native arm64 runners
  # (no QEMU emulation) and share a persisted ccache. Wall time = slowest
  # group instead of the sum of all five upstream projects.
  build:
    name: build-${{ matrix.group }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        group: [core, bind, openssh]
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -m
          nproc
          docker version --format '{{.Server.Version}}'

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: build/.ccache
          key: ccache-${{ matrix.group }}-${{ hashFiles('build/build-static.sh') }}
          restore-keys: |
            ccache-${{ matrix.group }}-
            ccache-

      - name: Build ${{ matrix.group }}
        run: bash build/assemble.sh ${{ matrix.group }}

      - uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.group }}
          path: build/static-out/*
          if-no-files-found: error

  package:
    name: package
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: static-*
          merge-multiple: true
          path: build/art

      - name: Stage artifacts
        run: |
          mkdir -p build/static-out
          cp -f build/art/* build/static-out/
          ls -l build/static-out

      - name: Assemble module payload
        run: bash build/package.sh

      - name: Verify payload is static
        run: |
          fail=0
          for f in module/system/bin/.ksutools/*; do
            if readelf -l "$f" | grep -q INTERP; then
              echo "::error::$f is dynamically linked"
              fail=1
            fi
          done
          exit "$fail"

      - name: Package zip
        id: zip
        run: |
          version=$(sed -n 's/^version=//p' module/module.prop)
          ( cd module && zip -qr9 "../ksutools-${version}.zip" . )
          echo "archive=ksutools-${version}.zip" >> "$GITHUB_OUTPUT"
          ls -l ksutools-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ksutools-zip
          path: ksutools-*.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ksutools-*.zip
